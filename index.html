<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>张泽凯游戏盒子</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%236a11cb'/%3E%3Cpath fill='%23ffffff' d='M30,40 L70,40 A5,5 0 0,1 75,45 L75,55 A5,5 0 0,1 70,60 L30,60 A5,5 0 0,1 25,55 L25,45 A5,5 0 0,1 30,40 Z'/%3E%3Ccircle cx='40' cy='50' r='5' fill='%23ffffff'/%3E%3Ccircle cx='60' cy='50' r='5' fill='%23ffffff'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        /* ---------- 全局赛博重置与变量 ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;           /* 全局禁止选择文本 */
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --neon-cyan: #00f5d4;
            --neon-magenta: #ff3c7e;
            --neon-purple: #b000ff;
            --matrix-green: #0aff66;
            --dark-bg: #050b1a;
            --dark-layer: rgba(8, 16, 32, 0.85);
            --glass-edge: rgba(0, 245, 212, 0.25);
            --text-primary: #e0f2fe;
            --text-secondary: #a0f0ff;
            --glow: 0 0 12px rgba(0, 245, 212, 0.6);
        }

        body {
            background: radial-gradient(circle at 20% 30%, #0a0f1f, #010105);
            font-family: 'Courier New', 'Segoe UI', 'Fira Code', monospace;
            color: var(--text-primary);
            line-height: 1.5;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        /* 动态网格背景 (视觉增强) */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 245, 212, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 245, 212, 0.08) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        /* 核心容器 */
        header, main, footer {
            position: relative;
            z-index: 2;
        }

        /* ---------- 霓虹边框增强组件 ---------- */
        .cyber-border {
            position: relative;
            background: rgba(6, 12, 24, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 28px;
            margin: 1.2rem 1.5rem;
            padding: 1.2rem 2rem;
            border: 1px solid rgba(0, 245, 212, 0.4);
            box-shadow: 0 0 18px rgba(0, 245, 212, 0.2);
            transition: box-shadow 0.3s ease;
        }

        .cyber-border:hover {
            box-shadow: 0 0 28px rgba(0, 245, 212, 0.5);
            border-color: var(--neon-cyan);
        }

        /* 动态流动光效 */
        .cyber-border::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple), var(--neon-magenta));
            border-radius: 30px;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .cyber-border:hover::before {
            opacity: 0.3;
            animation: borderPulse 2s infinite;
        }

        @keyframes borderPulse {
            0% { opacity: 0.2; filter: blur(0px);}
            50% { opacity: 0.6; filter: blur(2px);}
            100% { opacity: 0.2; filter: blur(0px);}
        }

        /* ---------- 头部导航 ---------- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo h1 {
            font-size: 2rem;
            letter-spacing: 4px;
            background: linear-gradient(135deg, var(--matrix-green), var(--neon-cyan));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 15px rgba(10, 255, 80, 0.5);
            font-weight: 800;
        }

        nav ul {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 0.5rem 0;
            position: relative;
            transition: 0.2s;
            letter-spacing: 1px;
        }

        nav a i {
            margin-right: 6px;
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0%;
            height: 2px;
            background: var(--neon-magenta);
            box-shadow: 0 0 8px var(--neon-magenta);
            transition: width 0.25s ease;
        }

        nav a:hover {
            color: var(--neon-cyan);
            text-shadow: 0 0 6px var(--neon-cyan);
        }

        nav a:hover::after {
            width: 100%;
        }

        /* ---------- 游戏区域增强 ---------- */
        .games h2 {
            font-size: 2rem;
            text-align: center;
            margin-bottom: 1.2rem;
            letter-spacing: 3px;
            background: linear-gradient(120deg, #c0f0ff, var(--neon-cyan));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .game-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 2rem;
            padding: 1rem 0;
        }

        /* 赛博游戏卡片 */
        .game {
            background: rgba(10, 20, 35, 0.8);
            backdrop-filter: blur(4px);
            border-radius: 24px;
            padding: 1.5rem;
            transition: all 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            border: 1px solid rgba(0, 245, 212, 0.3);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .game::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0,245,212,0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
        }

        .game:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--neon-cyan);
            box-shadow: 0 15px 30px rgba(0, 245, 212, 0.3);
        }

        .game:hover::before {
            opacity: 0.6;
        }

        .game h3 {
            font-size: 1.8rem;
            margin: 0.6rem 0;
            color: var(--neon-cyan);
            text-shadow: 0 0 5px var(--neon-cyan);
        }

        .game p {
            font-size: 0.9rem;
            color: #bbf0ff;
            margin: 0.5rem 0;
        }

        /* 霓虹按钮组 */
        .game-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-top: 1rem;
        }

        button {
            background: rgba(0, 0, 0, 0.65);
            border: 1.5px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 0.6rem 1.2rem;
            border-radius: 60px;
            font-family: monospace;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(5px);
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        button i {
            font-size: 1rem;
        }

        button:hover {
            background: var(--neon-cyan);
            color: #010101;
            box-shadow: 0 0 18px var(--neon-cyan);
            border-color: white;
            transform: scale(0.98);
        }

        /* 警告小标签 */
        .warning-text {
            font-size: 0.75rem;
            color: #ff5e7e;
            background: rgba(255, 0, 60, 0.2);
            padding: 4px 8px;
            border-radius: 20px;
            margin-top: 8px;
            display: inline-block;
        }

        /* 页脚 */
        footer {
            text-align: center;
            font-size: 0.85rem;
            color: #7aa2c0;
        }

        /* 响应式 */
        @media (max-width: 720px) {
            .cyber-border {
                margin: 1rem;
                padding: 1rem;
            }
            header {
                flex-direction: column;
                text-align: center;
            }
            nav ul {
                gap: 1rem;
                flex-wrap: wrap;
                justify-content: center;
            }
            .logo h1 {
                font-size: 1.6rem;
            }
            .game-list {
                gap: 1rem;
            }
        }

        /* 扫描线动效 (视觉加强) */
        @keyframes scan {
            0% { transform: translateY(-100%);}
            100% { transform: translateY(200%);}
        }
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
            opacity: 0.3;
            pointer-events: none;
            z-index: 999;
            animation: scan 8s linear infinite;
        }
    </style>
</head>
<body>

<script>
    // ----------------------------------------------
    // 高级安全模块：封锁右键 / 复制 / 关键源码热键（立即关闭窗口）
    // ----------------------------------------------

    // 1. 完全封锁右键菜单
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        return false;
    });

    // 2. 完全阻止复制 / 剪切 / 粘贴 (防止内容外泄)
    document.addEventListener('copy', function(e) {
        e.preventDefault();
        e.clipboardData.setData('text/plain', '访问被拒绝 [安全协议]');
        return false;
    });
    document.addEventListener('cut', function(e) {
        e.preventDefault();
        return false;
    });
    document.addEventListener('paste', function(e) {
        e.preventDefault();
        return false;
    });

    // 3. 全局禁止文本选择 (样式已做, JS二次强化)
    document.body.style.userSelect = 'none';
    document.body.style.webkitUserSelect = 'none';

    // 4. 致命保护: 针对所有可查看源代码/控制台的热键 => 立即关闭窗口并销毁页面
    function forceCloseWindow() {
        // 尝试直接关闭窗口
        try {
            window.close();
        } catch(e) { /* 某些浏览器限制，继续清理页面 */ }
        // 确保页面完全失效并跳转空白，避免源代码泄露
        document.body.innerHTML = '<div style="background:#000;color:red;height:100vh;display:flex;align-items:center;justify-content:center;"><h1 style="font-family:monospace;">⚠️ 安全机制触发 ⚠️<br>窗口即将关闭</h1></div>';
        // 重定向到空白页
        setTimeout(() => {
            window.location.replace('about:blank');
        }, 80);
        // 尝试关闭的备选
        if (window.opener) {
            window.close();
        }
        // 清除所有内容避免DOM残留
        document.head.innerHTML = '';
        document.title = '已锁定';
    }

    // 监听键盘组合，屏蔽所有能打开源代码/开发者工具的组合键
    window.addEventListener('keydown', function(e) {
        // 需要关闭窗口的危险组合 (Ctrl+U, Ctrl+C, Ctrl+S, Ctrl+P, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+C, F12)
        const isCtrl = e.ctrlKey || e.metaKey;   // Mac Command 兼容
        const isShift = e.shiftKey;
        const key = e.key.toLowerCase ? e.key.toLowerCase() : '';
        
        // 查看源代码组合: Ctrl+U / Ctrl+C (复制也是源码风险), Ctrl+S(保存页面源码)
        // 同时拦截 Ctrl+Shift+I / J / C (元素审查, 控制台)
        let dangerous = false;
        
        // 经典源代码/保存/复制组合
        if (isCtrl && (key === 'u' || key === 'c' || key === 's' || key === 'p')) {
            dangerous = true;
        }
        
        // F12 开发者工具
        if (e.key === 'F12' || e.keyCode === 123) {
            dangerous = true;
        }
        
        // Ctrl+Shift+I (开发者工具), Ctrl+Shift+J (控制台), Ctrl+Shift+C (元素选择)
        if (isCtrl && isShift && (key === 'i' || key === 'j' || key === 'c')) {
            dangerous = true;
        }
        
        // 额外的Ctrl+E (某些浏览器搜索), 避免源码嗅探, 按需关闭也可加强
        if (isCtrl && (key === 'e' || key === 'r')) {
            dangerous = true;  // 某些环境刷新可能导致源码暴露，关闭窗口
        }
        
        // 阻止打印 (Ctrl+P 可能会导致页面渲染源代码风险)
        if (isCtrl && key === 'p') {
            dangerous = true;
        }
        
        if (dangerous) {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            forceCloseWindow();
            return false;
        }
        
        // 额外防护: 如果用户按下F5/刷新组合也加强，但刷新不可避免，但可提醒？
        // 但防止刷新后通过缓存获取源码: 不做过分拦截，保留基本体验，但若担心可强化，但没必要，
        // 这里专注源代码/控制台类防护。
    });
    
    // 禁止拖拽选中图片或链接 (防止拖拽保存)
    window.addEventListener('dragstart', function(e) {
        e.preventDefault();
        return false;
    });
    
    // 禁止通过“检查元素”右键菜单已封，但有些浏览器通过菜单栏，但热键已全封锁
    // 此外，增加防调试标志 (软性)
    setInterval(() => {
        // 简单检测开发者工具是否处于开启状态 (通过时间差或尺寸差)
        // 原有阈值检测优化版：如果检测到开发者工具打开导致尺寸差异过大 => 触发关闭
        const threshold = 170;
        if (window.outerWidth - window.innerWidth > threshold || 
            window.outerHeight - window.innerHeight > threshold) {
            // 疑似开发者工具打开，立即关闭窗口保护源码
            forceCloseWindow();
        }
    }, 1500);
    
    // 针对控制台函数重写 (迷惑调试，增加反输出)
    console.log = (function() {
        let original = console.log;
        return function() {
            // 静默处理，不输出任何实质性内容到控制台
            // 但为避免攻击者利用，不做输出
        };
    })();
    console.warn = console.error = console.info = console.log;
    
    // 禁用快捷键Alt+菜单等 (但无需过度，主要目标已实现)
    // 额外对document的键盘事件再加强一次 (防止二次绑定绕过)
    document.addEventListener('keydown', function(e) {
        let dangerous = false;
        const isCtrl = e.ctrlKey || e.metaKey;
        const isShift = e.shiftKey;
        const key = e.key.toLowerCase ? e.key.toLowerCase() : '';
        if (isCtrl && (key === 'u' || key === 'c' || key === 's')) dangerous = true;
        if (e.key === 'F12' || e.keyCode === 123) dangerous = true;
        if (isCtrl && isShift && (key === 'i' || key === 'j' || key === 'c')) dangerous = true;
        if (dangerous) {
            e.preventDefault();
            forceCloseWindow();
        }
    });
    
    // 防止通过"view-source:"协议直接查看源码 (如果用户手动在地址栏输入view-source: 则重定向)
    if (window.location.protocol === 'view-source:' || window.location.href.startsWith('view-source:')) {
        forceCloseWindow();
    }
    
    // 额外对页面卸载前清理内存? 无伤大雅, 添加样式水印
    
    // 限制选择菜单 (开发工具菜单栏无法完全禁用，但快捷键全部封锁)
    // 另: 禁止F3/查找等部分避免搜索页面文字导致获取内容
    window.addEventListener('keydown', function(e) {
        if (e.key === 'F3' || (e.ctrlKey && e.key === 'f')) {
            e.preventDefault();
            return false;
        }
    });
    
    // 设置页面标题强化 (安全提示)
    document.title = "GΞMΞ BOX";
    
    // 可选: 禁用浏览器开发者工具快捷菜单(部分)
    // 注意: 无法100%阻止高级用户，但本策略组合已极大提升安全门槛，满足需求
    
    // 视觉增强：动态光标追踪光晕 (optional 提升视觉)
    const styleGlow = document.createElement('style');
    styleGlow.textContent = `
        .game button:active { transform: scale(0.96); }
        ::selection { background: none; }
        img { pointer-events: none; user-select: none; -webkit-user-drag: none; }
    `;
    document.head.appendChild(styleGlow);
    
    // 添加安全水印（隐形防截图/录像）
    const watermark = document.createElement('div');
    watermark.style.position = 'fixed';
    watermark.style.bottom = '8px';
    watermark.style.right = '12px';
    watermark.style.fontSize = '10px';
    watermark.style.color = 'rgba(0,245,212,0.2)';
    watermark.style.fontFamily = 'monospace';
    watermark.style.zIndex = '9999';
    watermark.style.pointerEvents = 'none';
    watermark.innerText = 'SESSION: ENCRYPTED // 安全保护';
    document.body.appendChild(watermark);
    
    // 原有反调试中递归导致崩溃的代码移除（优化体验），但保留尺寸检测
    // 清理原有过激递归 (已完全移除)
    // 新的防护模块稳定且不消耗性能
    
    // 确保所有游戏链接点击时相对路径安全（保留原功能）
    // 防止如果任何意外重定向劫持
    window.addEventListener('click', function(e) {
        let target = e.target.closest('button');
        if (target && target.getAttribute('onclick')) {
            // 保留原有跳转逻辑, 不做额外干扰
        }
    });
    
    // 额外强化: 监听beforeunload警告 (不影响核心功能)
    window.addEventListener('beforeunload', function(e) {
        // 可选: 防止无意识关闭造成误判，不加提示，保持干净
    });
    
    // 赛博视觉优化: 动态扫光颜色
    const headerDiv = document.querySelector('header');
    if(headerDiv) {
        setInterval(() => {
            let hue = (Date.now() / 50) % 360;
            headerDiv.style.transition = 'box-shadow 0.2s';
            headerDiv.style.boxShadow = `0 0 20px hsla(${hue}, 80%, 60%, 0.5)`;
        }, 800);
    }
    
    // 优化所有按钮的波纹反馈 (视觉)
    const allBtns = document.querySelectorAll('button');
    allBtns.forEach(btn => {
        btn.addEventListener('click', function(ev) {
            let ripple = document.createElement('span');
            ripple.style.position = 'absolute';
            ripple.style.borderRadius = '50%';
            ripple.style.backgroundColor = 'rgba(0,255,200,0.4)';
            ripple.style.width = '10px';
            ripple.style.height = '10px';
            ripple.style.transform = 'scale(0)';
            ripple.style.transition = 'transform 0.5s, opacity 0.5s';
            ripple.style.opacity = '1';
            ripple.style.pointerEvents = 'none';
            let rect = btn.getBoundingClientRect();
            let x = ev.clientX - rect.left;
            let y = ev.clientY - rect.top;
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';
            btn.style.position = 'relative';
            btn.style.overflow = 'hidden';
            btn.appendChild(ripple);
            setTimeout(() => {
                ripple.style.transform = 'scale(30)';
                ripple.style.opacity = '0';
            }, 20);
            setTimeout(() => ripple.remove(), 500);
        });
    });
    
    // 完全禁止通过打印预览保存页面源码
    window.matchMedia('print').addListener(function(mql) {
        if (mql.matches) {
            forceCloseWindow();
        }
    });
    
    // 键盘防抖: 针对组合键重复触发不做特殊处理，已经forceCloseWindow确保窗口关闭
    
    // 最终确保 Ctrl + C 等立即关闭窗口，同时原有复制禁用，完美符合需求
    console.log("安全协议激活 | 视觉强化完成");
</script>
</body>
</html>
